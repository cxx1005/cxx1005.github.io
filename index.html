    <style>
        body {
            background-color: #FFF8E7;
            margin: 0;
            padding: 20px;
            font-family: '微软雅黑', sans-serif;
            text-align: center;
        }

        h1 {
            color: #2C3E50;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        #statusBar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px;
            flex-wrap: wrap;
        }

        .status-item {
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-width: 120px;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .bubble {
            background: linear-gradient(145deg, rgba(255,255,255,0.2), transparent);
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            font-size: 1.2em;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            user-select: none;
        }

        .bubble.selected {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .bubble.error {
            animation: shake 0.5s;
            background-color: #FFEBEE !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 1000;
            max-width: 80%;
        }

        .restart-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .error { color: #E74C3C; }
        .warning { color: #F39C12; }
        .success { color: #4CAF50; }
    </style>
</head>

            errors: 0,
            matched: 0,
            timeLeft: 60,
            totalPairs: 8,
            maxErrors: 3,
            gameActive: false
        };

        let gameLoop;

        function startNewGame() {
            // 重置游戏状态
            gameState = {
                selected: [],
                errors: 0,
                matched: 0,
                timeLeft: 60,
                totalPairs: 8,
                maxErrors: 3,
                gameActive: true
            };
            
            // 清除之前的游戏循环
            clearInterval(gameLoop);
            
            // 初始化界面
            document.getElementById('endScreen').style.display = 'none';
            updateStatus();
            createGameBoard();
            
            // 尝试播放背景音乐
            document.getElementById('bgm').play().catch(e => {
                console.log("自动播放被阻止:", e);
            });

            // 启动游戏循环
            gameLoop = setInterval(() => {
                gameState.timeLeft--;
                updateStatus();
                
                if (gameState.timeLeft <= 0) {
                    gameOver("时间到！");
                }
            }, 1000);
        }

        function createGameBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            // 随机选择词汇
            const shuffled = [...fullVocabulary]
                .sort(() => Math.random() - 0.5)
                .slice(0, gameState.totalPairs);
            
            // 创建配对词汇
            const allWords = [];
            shuffled.forEach(word => {
                allWords.push({ text: word.en, pair: word.ch });
                allWords.push({ text: word.ch, pair: word.en });
            });

            // 打乱顺序
            allWords.sort(() => Math.random() - 0.5);

            // 创建泡泡
            allWords.forEach(word => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = word.text;
                bubble.dataset.pair = word.pair;
                
                // 随机颜色
                const hue = Math.floor(Math.random() * 360);
                bubble.style.backgroundColor = `hsl(${hue}, 70%, 60%)`;
                
                bubble.addEventListener('click', handleBubbleClick);
                board.appendChild(bubble);
            });
        }

        function handleBubbleClick(e) {
            if (!gameState.gameActive) return;
            
            const bubble = e.target;
            
            // 如果泡泡已经消失或已被选中，则忽略点击
            if (bubble.style.opacity === '0' || gameState.selected.includes(bubble)) return;

            // 播放点击音效
            new Audio('泡泡音.mp3').play().catch(() => {});
            
            // 选中泡泡
            bubble.classList.add('selected');
            gameState.selected.push(bubble);

            // 如果选中了两个泡泡，检查是否匹配
            if (gameState.selected.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = gameState.selected;
            const isMatch = first.dataset.pair === second.textContent && 
                          second.dataset.pair === first.textContent;

            if (isMatch) {
                // 匹配成功
                gameState.matched++;
                gameState.errors = 0; // 重置错误计数
                
                // 消失动画
                first.style.opacity = '0';
                second.style.opacity = '0';
                
                // 检查是否完成所有匹配
                if (gameState.matched === gameState.totalPairs) {
                    gameOver("挑战成功！");
                }
            } else {
                // 匹配失败
                gameState.errors++;
                
                // 错误动画
                gameState.selected.forEach(b => {
                    b.classList.add('error');
                    setTimeout(() => {
                        b.classList.remove('selected', 'error');
                    }, 800);
                });
                
                // 检查是否达到最大错误次数
                if (gameState.errors >= gameState.maxErrors) {
                    gameOver("错误次数用尽！");
                    return;
                }
            }

            // 清空选中状态
            gameState.selected = [];
            updateStatus();
        }

        function gameOver(reason) {
            gameState.gameActive = false;
            clearInterval(gameLoop);
            
            // 设置结束消息
            const messages = {
                "挑战成功！": {
                    text: "🎉 恭喜完成所有匹配！",
                    class: "success"
                },
                "时间到！": {
                    text: "⌛ 时间用尽！",
                    class: "warning"
                },
                "错误次数用尽！": {
                    text: "💥 连续错误三次！",
                    class: "error"
                }
            };
            
            const result = messages[reason];
            const resultElement = document.getElementById('resultMessage');
            resultElement.textContent = result.text;
            resultElement.className = result.class;
            
            // 显示最终成绩
            document.getElementById('finalScore').textContent = gameState.matched;
            
            // 显示结束界面
            document.getElementById('endScreen').style.display = 'block';
        }

        function updateStatus() {
            // 更新时间显示
            document.getElementById('timer').textContent = gameState.timeLeft;
            
            // 更新错误次数显示
            const errorsLeft = gameState.maxErrors - gameState.errors;
            document.getElementById('errorsLeft').textContent = errorsLeft;
            
            // 根据剩余错误次数更新颜色
            const errorDisplay = document.getElementById('errorsLeft').parentElement;
            errorDisplay.className = `status-item ${
                errorsLeft <= 1 ? 'error' : 
                errorsLeft <= 2 ? 'warning' : ''
            }`;
            
            // 更新匹配计数
            document.getElementById('matchedCount').textContent = gameState.matched;
        }

        // 初始化游戏
        startNewGame();
    </script>
</body>
</html>
